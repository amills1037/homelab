services:
  qwen3.8-flash-next:
    hostname: qwen
    image: ghcr.io/peonist-ai/halogen-flash-server:0.20.3
    environment:
      - HALOGEN_DOWNLOAD=peonist-ai/halogen-qwen3.8-flash-next
    restart: unless-stopped
    volumes:
      - /home/ansible/qwen3.8:/models
    privileged: true
    group_add:
      - video #44
      - 992 #render
    ipc: host
    ulimits:
       memlock:
         soft: -1
         hard: -1
    ports:
      - "8001:8731"
    devices:
      - /dev/kfd
      - /dev/dri
