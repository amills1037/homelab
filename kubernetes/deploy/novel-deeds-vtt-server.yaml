apiVersion: v1
kind: Service
metadata:
  name: novel-deeds-vtt-service
  namespace: novel-deeds
spec:
  ports:
    - protocol: TCP
      port: 8080
  selector:
    app: novel-deeds-vtt-server
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novel-deeds-vtt-server
  namespace: novel-deeds
  annotations:
      tailscale.com/expose: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novel-deeds-vtt-server
  template:
    metadata:
      labels:
        app: novel-deeds-vtt-server
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - cluster
      containers:
        - name: novel-deeds-vtt-server
          image: ghcr.io/sbustillos/novel-deeds-vtt-server:main
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: better-auth
                  key: secret
            - name: BETTER_AUTH_URL
              value: https://vtt.noveldeeds.com
            - name: ALLOWED_ORIGINS
              value: https://vtt.noveldeeds.com,https://www.noveldeeds.com
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /var/lib/noveldeeds/vtt.db
            - name: UPLOAD_DIR
              value: /var/lib/noveldeeds/uploads
          volumeMounts:
            - name: novel-deeds-vtt-storage
              mountPath: /var/lib/noveldeeds
      imagePullSecrets:
        - name: ghcr-secret
      tolerations:
        - key: "server"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
  volumeClaimTemplates:
    - metadata:
        name: novel-deeds-vtt-storage
        namespace: pi-hole
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: cluster-storage
        resources:
          requests:
            storage: 5Gi
