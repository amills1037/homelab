apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-device-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
# devices:
#     - /dev/kfd
#     - /dev/dri
# a

apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-dev-kfd
spec:
  volumeMode: Filesystem # Or "Block" for a raw block device
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-device-storage
  local:
    path: /dev/kfd # The path on your host node where the device is mounted
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - aila
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-dev-dri
spec:
  volumeMode: Filesystem # Or "Block" for a raw block device
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-device-storage
  local:
    path: /dev/dri
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - aila
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-ssd-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-device-storage
