---
- name: Initialize K3S primary control plane
  hosts: kube_prime_node
  become: true
  vars_files:
    - ../k3s-vars.yaml
  tasks:
    - name: Init cluster on primary node
      ansible.builtin.shell: |
        echo curl -sfL https://get.k3s.io | K3S_TOKEN={{ k3s_token }} sh -s - server --disable=servicelb --cluster-init

