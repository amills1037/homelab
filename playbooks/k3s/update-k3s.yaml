---
- name: Update K3S primary control plane
  hosts: kube_prime_node
  become: true
  vars_files:
    - ../../k3s-vars.yaml
  tasks:
    - name: Update primary control plane
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_TOKEN={{ k3s_token }} sh -s - server --disable=servicelb --cluster-init

- name: Update K3S seconday control planes
  hosts: kube_secondary_nodes
  become: true
  vars_files:
    - ../../k3s-vars.yaml
  tasks:
    - name: Update seconday control planes
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_TOKEN={{ k3s_token }} sh -s - server --disable=servicelb --server https://{{ k3s_primary_ip }}:6443
